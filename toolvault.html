    @font-face {
      font-family: 'Geist Mono';
      src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/GeistMono%5Bwght%5D.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Geist Pixel Square';
      src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-pixel/GeistPixel-Square.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Geist Pixel Grid';
      src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-pixel/GeistPixel-Grid.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --font-body: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-display: 'Geist Pixel Square', 'Geist Mono', monospace;
      --font-grid: 'Geist Pixel Grid', 'Geist Mono', monospace;
      --radius: 10px;
      --radius-sm: 6px;
      --transition: 0.2s ease;
    }

    [data-theme="dark"] {
      --bg: #08090b;
      --bg-raised: #0d0f12;
      --bg-card: #101215;
      --bg-soft: #14171b;
      --text: #f2f4ef;
      --text-soft: #a0a59d;
      --text-faint: #6d726b;
      --line: #262a2d;
      --line-strong: #393e41;
      --accent: #caff3d;
      --accent-soft: rgba(202, 255, 61, 0.12);
      --purple: #a58aff;
      --cyan: #5ce1e6;
      --orange: #ff9f43;
      --pink: #ff75aa;
      --blue: #67a8ff;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
      --green-bg: rgba(202, 255, 61, 0.1);
      --green-text: #caff3d;
      --yellow-bg: rgba(245, 185, 66, 0.12);
      --yellow-text: #f5b942;
      --red-bg: rgba(239, 91, 91, 0.12);
      --red-text: #ef5b5b;
    }

    [data-theme="light"] {
      --bg: #f1f2ed;
      --bg-raised: #f8f9f5;
      --bg-card: #fafbf7;
      --bg-soft: #e7e9e2;
      --text: #11130f;
      --text-soft: #545950;
      --text-faint: #81877d;
      --line: #d2d5cd;
      --line-strong: #afb4a9;
      --accent: #577a00;
      --accent-soft: rgba(87, 122, 0, 0.12);
      --purple: #7c3aed;
      --cyan: #0891b2;
      --orange: #ea580c;
      --pink: #db2777;
      --blue: #2563eb;
      --shadow: 0 28px 80px rgba(20, 24, 16, 0.11);
      --green-bg: rgba(87, 122, 0, 0.1);
      --green-text: #577a00;
      --yellow-bg: rgba(180, 130, 30, 0.12);
      --yellow-text: #8a6d0e;
      --red-bg: rgba(220, 60, 60, 0.1);
      --red-text: #b91c1c;
    }

    html { font-size: 15px; }
    body {
      font-family: var(--font-body);
      background: radial-gradient(circle at 50% -20%, rgba(202, 255, 61, 0.043), transparent 32rem), var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .container { max-width: 1140px; margin: 0 auto; padding: 95px 20px 0; }

    .hero {
      padding: 0 0 32px;
      text-align: center;
      position: relative;
    }
    .hero-fixed {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: var(--bg);
      padding: 10px 0;
      box-shadow: 0 1px 0 var(--line);
    }
    .hero-fixed .hero-fixed-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .hero-fixed h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.1;
      text-transform: uppercase;
      animation: glitch 3s infinite;
      animation-timing-function: steps(1);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .hero-fixed h1 .accent { color: var(--accent); }
    .hero-fixed .search-wrap {
      flex: 1;
      max-width: 400px;
      margin: 0;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: 2.6rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.1;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    @keyframes glitch {
      0%, 88%, 100% { text-shadow: none; transform: none; }
      89% { text-shadow: -3px 0 #ff0040, 3px 0 #00e5ff; transform: translate(-1px, 0) skew(-0.5deg); }
      90% { text-shadow: 3px 0 #ff0040, -3px 0 #00e5ff; transform: translate(1px, 0) skew(0.5deg); }
      91% { text-shadow: -2px 0 #ff0040, 2px 0 #00e5ff; transform: translate(0, -1px) skew(0deg); }
      92% { text-shadow: 2px 0 #ff0040, -2px 0 #00e5ff; transform: translate(0, 1px) skew(0deg); }
      93% { text-shadow: -1px 0 #ff0040, 1px 0 #00e5ff; transform: translate(0, 0) skew(0.3deg); }
      94% { text-shadow: 1px 0 #ff0040, -1px 0 #00e5ff; transform: translate(0, 0) skew(-0.3deg); }
    }
    .hero h1 .accent { color: var(--accent); }
    .hero .subtitle {
      font-size: 0.85rem;
      color: var(--text-soft);
      max-width: 500px;
      margin: 0 auto 18px;
      line-height: 1.6;
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--text-faint);
      margin-bottom: 28px;
    }
    .stats span { display: flex; align-items: center; gap: 4px; }
    .stats strong {
      font-family: var(--font-grid);
      font-weight: 400;
      color: var(--text);
      font-size: 0.9rem;
    }

    .search-wrap {
      max-width: 480px;
      margin: 0 auto 28px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg-raised);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.8rem;
      outline: none;
      transition: all var(--transition);
      text-align: center;
    }
    .search-wrap input::placeholder { color: var(--text-faint); }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin-bottom: 28px;
    }
    .pill {
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 0.72rem;
      font-weight: 500;
      background: transparent;
      color: var(--text-soft);
      border: 1px solid var(--line);
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .pill:hover { border-color: var(--text-faint); color: var(--text); }
    .pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .pill .count {
      display: inline-block;
      margin-left: 4px;
      font-size: 0.65rem;
      color: var(--text-faint);
    }
    .pill.active .count { color: var(--accent); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .toolbar-left { display: flex; align-items: center; gap: 12px; }
    .results-info {
      font-size: 0.72rem;
      color: var(--text-faint);
    }
    .results-info strong { color: var(--text); font-weight: 500; }
    .toolbar-right { display: flex; align-items: center; gap: 6px; }
    .tool-btn {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      min-width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-soft);
      font-family: var(--font-body);
      padding: 0 8px;
      transition: all var(--transition);
    }
    .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tool-btn.active-lang {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .divider { height: 1px; background: var(--line); margin-bottom: 16px; }

    .grid { display: flex; flex-direction: column; gap: 6px; padding-bottom: 60px; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: all var(--transition);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow);
      background: var(--bg-raised);
    }
    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--bg-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-header {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 2px;
    }
    .card-header h3 {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .card-header .arrow {
      color: var(--text-faint);
      font-size: 0.7rem;
      transition: color var(--transition);
    }
    .card:hover .arrow { color: var(--accent); }
    .card p {
      font-size: 0.7rem;
      color: var(--text-soft);
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .card-tags {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .card .tag {
      font-size: 0.6rem;
      font-weight: 500;
      padding: 1px 7px;
      border-radius: 100px;
      background: var(--bg-soft);
      color: var(--text-faint);
    }
    .card .badge {
      font-size: 0.6rem;
      font-weight: 500;
      padding: 1px 7px;
      border-radius: 100px;
    }
    .card .badge.free {
      background: var(--green-bg);
      color: var(--green-text);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    }
    .card .badge.nosignup {
      background: var(--yellow-bg);
      color: var(--yellow-text);
      border: 1px solid color-mix(in srgb, #f5b942 55%, var(--line));
    }
    .card .badge.trial {
      background: var(--red-bg);
      color: var(--red-text);
      border: 1px solid color-mix(in srgb, #ef5b5b 55%, var(--line));
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-faint);
    }
    .empty-state .emoji { font-size: 1.8rem; margin-bottom: 10px; }
    .empty-state p { font-size: 0.78rem; }

    .footer {
      border-top: 1px solid var(--line);
      padding: 20px 0;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-faint);
    }
    .footer a { color: var(--text-soft); text-decoration: underline; text-underline-offset: 3px; }
    .footer a:hover { color: var(--accent); }

    @media (max-width: 720px) {
      .hero-fixed { padding: 8px 0; }
      .hero-fixed h1 { font-size: 1.2rem; }
      .hero-fixed .hero-fixed-inner { flex-wrap: wrap; justify-content: center; }
      .hero-fixed .search-wrap { max-width: 100%; }
      .container { padding: 100px 14px 0; }
      .hero h1 { font-size: 1.6rem; }
      .hero { padding: 32px 0 20px; }
      .stats { gap: 12px; font-size: 0.7rem; }
      .card { padding: 12px 14px; }
    }
    @media (max-width: 480px) {
      .pills { justify-content: flex-start; }
    }
  </style>
</head>

    { id:106, name:"Hygraph",        desc_es:"Plataforma de contenido nativa en GraphQL para contenido estructurado multi-fuente.",                            desc_en:"GraphQL-native content platform for structured, multi-source content.",                                                   cat:"Content & CMS",                icon:"✦", url:"https://hygraph.com",       badge:"free" },
    { id:107, name:"DatoCMS",        desc_es:"CMS headless con entrega GraphQL y pipeline de imágenes integrado.",                                            desc_en:"Headless CMS with GraphQL delivery and a built-in image pipeline.",                                                      cat:"Content & CMS",                icon:"✦", url:"https://datocms.com",       badge:"free" },
    { id:108, name:"Prismic",        desc_es:"CMS de construcción de páginas con slices reutilizables y previsualizaciones.",                                 desc_en:"Page-building CMS with reusable slices and visual previews for editors.",                                                cat:"Content & CMS",                icon:"✦", url:"https://prismic.io",        badge:"free" },
    { id:109, name:"Uploadcare",     desc_es:"Subida de archivos, procesamiento de imágenes y entrega adaptativa para apps web.",                             desc_en:"File uploads, image processing and adaptive delivery for web apps.",                                                     cat:"Storage & media",              icon:"✦", url:"https://uploadcare.com",    badge:"free" },
    { id:110, name:"ImageKit",       desc_es:"Optimización, transformación y entrega de imágenes y video en tiempo real.",                                    desc_en:"Real-time image and video optimization, transformation and delivery.",                                                    cat:"Storage & media",              icon:"✦", url:"https://imagekit.io",       badge:"free" },
  ];

  let activeCategory = null;
  let searchQuery = '';
  let lang = 'es';

  const grid = document.getElementById('grid');
  const pills = document.getElementById('pills');
  const searchInput = document.getElementById('searchInput');
  const themeToggle = document.getElementById('themeToggle');
  const langToggle = document.getElementById('langToggle');
  const visibleCount = document.getElementById('visibleCount');
  const statTotal = document.getElementById('statTotal');
  const statCategories = document.getElementById('statCategories');

  function t(key) { return i18n[lang][key]; }

  function getCategories(data) {
    const map = {};
    data.forEach(r => {
      if (!map[r.cat]) map[r.cat] = { name: r.cat, count: 0 };
      map[r.cat].count++;
    });
    return Object.values(map).sort((a, b) => b.count - a.count);
  }

  function filterData(data, category, query) {
    return data.filter(r => {
      if (category && r.cat !== category) return false;
      if (query) {
        const q = query.toLowerCase();
        return r.name.toLowerCase().includes(q) || (lang === 'es' ? r.desc_es : r.desc_en).toLowerCase().includes(q) || r.cat.toLowerCase().includes(q);
      }
      return true;
    });
  }

  function renderPills(categories) {
    const allCount = resources.length;
    let html = `<span class="pill ${activeCategory === null ? 'active' : ''}" data-cat="">${t('all')} <span class="count">${allCount}</span></span>`;
    categories.forEach(c => {
      const active = activeCategory === c.name;
      html += `<span class="pill ${active ? 'active' : ''}" data-cat="${c.name}">${c.name} <span class="count">${c.count}</span></span>`;
    });
    pills.innerHTML = html;
    pills.querySelectorAll('.pill').forEach(el => {
      el.addEventListener('click', () => {
        activeCategory = el.dataset.cat || null;
        render();
      });
    });
  }

  function renderGrid(data) {
    if (!data.length) {
      grid.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><p>${t('empty')}</p></div>`;
      return;
    }
    grid.innerHTML = data.map(r => {
      const badgeKey = badgeKeys[r.badge];
      const badgeLabel = badgeKey ? t(badgeKey) : '';
      const desc = lang === 'es' ? r.desc_es : r.desc_en;
      return `
        <a class="card" href="${r.url}" target="_blank" rel="noopener">
          <div class="card-icon">${r.icon}</div>
          <div class="card-body">
            <div class="card-header">
              <h3>${r.name}</h3>
              <span class="arrow">↗</span>
            </div>
            <p>${desc}</p>
            <div class="card-tags">
              <span class="tag">${r.cat}</span>
              ${badgeLabel ? `<span class="badge ${r.badge}">${badgeLabel}</span>` : ''}
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  function applyUI() {
    document.documentElement.lang = lang;
    document.getElementById('metaTitle').textContent = t('title');
    document.getElementById('metaDesc').content = t('metaDesc');
    document.title = t('title');
    document.getElementById('heroSubtitle').textContent = t('subtitle');
    document.getElementById('labelResources').textContent = t('resources');
    document.getElementById('labelCategories').textContent = t('categories');
    document.getElementById('labelUpdated').textContent = t('updated');
    searchInput.placeholder = t('searchPlaceholder');
    document.getElementById('labelFound').textContent = t('found');
    document.getElementById('footerInspired').textContent = t('footerInspired');
    langToggle.textContent = lang === 'es' ? 'ES' : 'EN';
    langToggle.classList.toggle('active-lang', true);
  }

  function render() {
    applyUI();
    const filtered = filterData(resources, activeCategory, searchQuery);
    renderGrid(filtered);
    visibleCount.textContent = filtered.length;
    statTotal.textContent = resources.length;
    const cats = getCategories(resources);
    statCategories.textContent = cats.length;
    renderPills(cats);
  }

  searchInput.addEventListener('input', e => {
    searchQuery = e.target.value;
    render();
  });

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    themeToggle.textContent = next === 'dark' ? '☾' : '☀';
    localStorage.setItem('toolvault-theme', next);
  }
  themeToggle.addEventListener('click', toggleTheme);

  function toggleLang() {
    lang = lang === 'es' ? 'en' : 'es';
    localStorage.setItem('toolvault-lang', lang);
    render();
  }
  langToggle.addEventListener('click', toggleLang);

  (function init() {
    const savedTheme = localStorage.getItem('toolvault-theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☾' : '☀';
    }
    const savedLang = localStorage.getItem('toolvault-lang');
    if (savedLang) lang = savedLang;
    render();
  })();
</script>
</body>
</html>
